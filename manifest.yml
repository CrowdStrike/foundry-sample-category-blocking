name: Category Blocking
description: This Foundry app provides a comprehensive domain-blocking solution that simplifies firewall rule management through custom categories and automated rule deployment. Built on CrowdStrike's Falcon Foundry platform, this application streamlines domain-blocking workflows while providing valuable insights into blocking patterns.
logo: images/logo.png
vendor: CrowdStrike
vendor_products: []
use_case: Endpoint security
manifest_version: "2023-05-09"
ignored:
    - ui/(extensions|pages)/[^\/]*?/public
    - ui/(extensions|pages)/[^\/]*?/index.html
    - ui/(extensions|pages)/[^\/]*?/favicon.ico
    - ui/(extensions|pages)/.*?/node_modules
    - ui/(extensions|pages)/.*?/config
    - ui/(extensions|pages)/.*?/\.gitignore
    - ui/(extensions|pages)/.*?/package\.json
    - ui/(extensions|pages)/.*?/tsconfig\.json
    - ui/(extensions|pages)/.*?/tsconfig\..*\.json
    - ui/(extensions|pages)/.*?/.*?\.(md|log|lock|cjs)
    - e2e
    - e2e/.+
    - functions/.*/venv
    - functions/.*/venv/.+
    - functions/.*/__pycache__
    - functions/.*/__pycache__/.+
    - functions/.*/.*\.pyc
    - functions/.*/.*test.*\.py
ui:
    homepage: pages.urlblocking
    extensions: []
    pages:
        urlblocking:
            name: urlblocking
            description: react blocking test
            path: ui/pages/urlblocking/src/dist
            entrypoint: ui/pages/urlblocking/src/dist/index.html
            content_security_policy:
                connect-src: []
                style-src: []
                style-src-elem: []
                script-src: []
                form-action: []
                img-src: []
                media-src: []
                object-src: []
            permissions: []
    dashboards: {}
    navigation:
        links:
            - path: /
              name: Category Blocking
              permissions: []
              ref: pages.urlblocking
api_integrations: []
rtr_scripts: []
collections:
    - name: domain
      description: ""
      schema: collections/domain.json
      permissions: []
      workflow_integration:
        system_action: true
        tags: []
    - name: relationship
      description: to have relationship data
      schema: collections/relationship.json
      permissions: []
      workflow_integration:
        system_action: true
        tags: []
auth:
    scopes:
        - firewall-management:read
        - firewall-management:write
        - host-group:read
        - host-group:write
        - devices:read
        - devices:write
    permissions: {}
    roles: []
functions:
    - name: urlblock
      config: null
      description: react block
      path: functions/urlblock
      environment_variables: {}
      max_exec_duration_seconds: 300
      max_exec_memory_mb: 512
      handlers:
        - name: urlblock
          description: List available CrowdStrike host groups
          method: GET
          api_path: /urlblock
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: create-rule
          description: Create firewall policy with rule group and FQDN blocking rules
          method: POST
          api_path: /create-rule
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: domain-analytics
          description: Get domain analytics - top blocked domains, unique IPs and hosts
          method: GET
          api_path: /domain-analytics
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: import_csv_handler
          description: Bulk import categories and domains from CSV content
          method: POST
          api_path: /import-csv
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: list-categories
          description: List all categories with their domains
          method: GET
          api_path: /list-categories
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: search-categories
          description: Search for a specific category by name
          method: GET
          api_path: /search-categories
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: manage-categories
          description: Create or update a URL category in Custom Storage
          method: POST
          api_path: /manage-category
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: simulate-policy
          description: Check if a given FQDN would be blocked by any category
          method: GET
          api_path: /simulate-policy
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: list-policies
          description: List all policies created by the app with their categories
          method: GET
          api_path: /list-policies
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: delete-policy
          description: Delete a firewall policy, its rule group, and associated relationships
          method: POST
          api_path: /delete-policy
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: update-policy
          description: Update an existing policy by recreating its rule group and rules
          method: POST
          api_path: /update-policy
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: healthz
          description: Health check endpoint - confirms function is running
          method: GET
          api_path: /healthz
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: check-enforcement
          description: Check enforcement status of a specific firewall policy
          method: GET
          api_path: /check-enforcement
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []
        - name: health-check
          description: Validate all policies - enforcement, enabled, host groups and rule groups
          method: GET
          api_path: /health-check
          payload_type: ""
          request_schema: null
          response_schema: null
          workflow_integration: null
          permissions: []

      language: python
workflows: []
parsers: []
logscale:
    saved_searches: []
lookup_files: []
docs:
    path: app_docs
    entrypoint: README.md

