name: Sample CI
on: [ push, pull_request ]

permissions:
  contents: read

jobs:
  code-lint:
    name: Code lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
        with:
          fetch-depth: 0
      - name: Run Validation
        id: trufflehog
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            ghcr.io/trufflesecurity/trufflehog:latest \
            git file:///workspace/ --branch HEAD \
            --config=.github/custom_detectors.yaml --no-verification \
            --exclude-paths=.github/detector-exclude-paths.txt \
            --results=verified,unknown,unverified --json --no-update --fail \
            > trufflehog-results.json 2>/dev/null
        continue-on-error: true
      - name: Validation summary
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| # | Detector | File | Line | Commit |" >> $GITHUB_STEP_SUMMARY
          echo "|---|----------|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          jq -r 'select(.SourceMetadata) | "\(if .DetectorName == "CustomRegex" then (.ExtraData.name // "CustomRegex") else .DetectorName end) | \(.SourceMetadata.Data.Git.file) | L\(.SourceMetadata.Data.Git.line) | \(.SourceMetadata.Data.Git.commit)"' trufflehog-results.json | sort -u | awk '{printf "| %d | %s |\n", NR, $0}' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validation findings - failing build." >> $GITHUB_STEP_SUMMARY
      - name: Fail on validation findings
        if: steps.trufflehog.outcome == 'failure'
        run: exit 1

  test-functions:
    name: Test functions/urlblock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'functions/urlblock/requirements.txt'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
        working-directory: functions/urlblock
      - name: Run tests if test_main.py exists
        run: |
          if [ -f "test_main.py" ]; then
            echo "Running tests with test_main.py"
            pytest
          else
            echo "No test_main.py found, skipping tests"
          fi
        working-directory: functions/urlblock
      - name: Verify function starts
        run: |
          timeout 30s bash -c '
            python main.py > output.log 2>&1 &
            PID=$!
            while ! grep -q "running at port 8081" output.log 2>/dev/null; do
              sleep 1
            done
            echo "✅ Application started successfully"
            kill $PID 2>/dev/null || true
          ' || {
            echo "❌ Application failed to start"
            cat output.log 2>/dev/null || echo "No output log found"
            exit 1
          }
        working-directory: functions/urlblock

  build-ui:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8  # v6.0.1
      - name: Setup Node
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f  # v6.1.0
        with:
          node-version: 24.22.1
          cache: 'npm'
          cache-dependency-path: 'ui/pages/urlblocking/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: ui/pages/urlblocking
      - name: Build React app
        run: npm run build
        working-directory: ui/pages/urlblocking
